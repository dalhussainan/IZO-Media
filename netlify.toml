# Netlify configuration for IZO Media

[build]
  publish = "."

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/quwahub"
  to = "/quwahub/index.html"
  status = 200

# Force HTTPS
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Keep admin pages out of search engines
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin-tools.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Cache static assets (1 week, revalidate in background)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Quwa production hub — private team area, keep out of search engines
[[headers]]
  for = "/quwahub/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
